# Bundle patch for dsh-plugin-sessions.
# dataDir holds the plugin-owned audit log (audit.jsonl) and, by default, the
# trash folder (<dataDir>/trash). The default lives under the DSH home; set an
# absolute path in a profile's own patch to isolate it. A profile override
# addresses this row by its bare id sessions-manager (an include-prefixed id
# matches no row and is skipped). It replaces this whole config block, and a
# home-level <DSH home>/cordis.patch.yml applies after the profile patch.
#
# trashDir is optional and absent here (default <dataDir>/trash). When set, it
# must be an absolute path on the same device as the session store and outside
# the sessions tree; an invalid value is an error, never a fallback.
#
# recentActivityMinutes  a session active within this many minutes is not pruned
# listLimit              most rows one Archived page returns
# largeSessionBytes      reserved: accepted and clamped, not read in v1 (50 MiB)
# indexWarnBytes         on-disk size of the whole store that raises the search
#                        index warning (256 MiB, a heuristic)
# allowPermanentDelete   false disables "Delete permanently" in Trash
# refreshMs              page refresh interval in ms, 0 = manual refresh only
# planTtlMinutes         how long a prune plan stays valid
# snapshotTtlMs          how long a store snapshot is reused, in ms
- insert:
    - id: sessions-manager
      name: dsh-plugin-sessions
      config:
        dataDir: !!js dshHomePath('sessions-manager')
        recentActivityMinutes: 30
        listLimit: 500
        largeSessionBytes: 52428800
        indexWarnBytes: 268435456
        allowPermanentDelete: true
        refreshMs: 0
        planTtlMinutes: 10
        snapshotTtlMs: 15000
